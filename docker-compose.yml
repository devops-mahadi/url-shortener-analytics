version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: urlshortener-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: urlshortener
    volumes:
      - mongodb_data:/data/db
    networks:
      - urlshortener-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-api
    ports:
      - "8080:8080"
    environment:
      MongoDB__ConnectionString: mongodb://mongodb:27017
      MongoDB__DatabaseName: urlshortener
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - urlshortener-network

networks:
  urlshortener-network:
    driver: bridge

volumes:
  mongodb_data:
