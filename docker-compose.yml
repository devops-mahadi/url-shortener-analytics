version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: urlshortener-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: urlshortener
    volumes:
      - mongodb_data:/data/db
    networks:
      - urlshortener-network

networks:
  urlshortener-network:
    driver: bridge

volumes:
  mongodb_data:
